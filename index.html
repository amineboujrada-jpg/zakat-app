<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zakat</title>
<meta name="theme-color" content="#f4f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zakat">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  /* Appli téléphone une colonne : onglets Comptes / Crédits / Zakat, panneaux qui montent du bas */
  :root {
    --bg: #f4f3ef; --surface: #ffffff; --surface-2: #ecebe5; --line: #dddbd2;
    --fg: #1b2a24; --muted: #5b6b64; --faint: #9aa59f;
    --accent: #1f6b52; --accent-fg: #ffffff; --accent-soft: #e3efe9;
    --ok: #1f6b52; --warn: #9a5b00; --warn-bg: #f6eedb; --danger: #b3261e; --danger-bg: #fdecea;
    --hero: #1f6b52; --hero-fg: #ffffff; --hero-muted: #cfe6dc;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1412; --surface: #18201d; --surface-2: #222b27; --line: #2d3833;
      --fg: #eef3f0; --muted: #9db0a7; --faint: #5f6f68;
      --accent: #46b78d; --accent-fg: #06130e; --accent-soft: #1c3229;
      --ok: #46b78d; --warn: #f0b24f; --warn-bg: #33281a; --danger: #ff7b72; --danger-bg: #3a1d1b;
      --hero: #1d5a45; --hero-fg: #ffffff; --hero-muted: #b9dccd;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
  [hidden] { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px;
    padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(100px + env(safe-area-inset-bottom, 0px)); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  header h1 { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .hbtns { display: flex; gap: 8px; }
  .icon-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: 44px; height: 44px;
    display: inline-grid; place-items: center; padding: 0; }
  .icon-btn.spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
  .tab { border: 0; background: transparent; border-radius: 9px; padding: 10px 4px; font-weight: 700; font-size: 14.5px; color: var(--muted); }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .hero { background: var(--hero); color: var(--hero-fg); border-radius: 20px; padding: 18px 18px 14px; }
  .hero .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hero .lbl { color: var(--hero-muted); font-size: 13.5px; }
  .hero .big { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: 8px 0 8px; font-variant-numeric: tabular-nums; }
  .hero .line { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 14px; color: var(--hero-muted); }
  .hero .line b { color: var(--hero-fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .badge { background: #fff; color: #16503d; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 800; white-space: nowrap; }
  .badge.off { background: rgba(255,255,255,.18); color: #fff; }
  .rates { color: var(--muted); font-size: 12.5px; margin: 8px 2px 0; line-height: 1.4; }
  h2 { font-size: 16px; font-weight: 700; margin: 22px 0 10px; display: flex; justify-content: space-between; align-items: center; }
  h2 button { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 14px; padding: 6px 0; }
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); width: 100%; background: none; text-align: left; }
  .item:first-child { border-top: 0; }
  .item .av { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff; background: var(--accent); }
  .item .av.soft { background: var(--accent-soft); color: var(--accent); }
  .item .mid { flex: 1; min-width: 0; }
  .item .mid div { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item small { color: var(--muted); display: block; font-size: 12.5px; margin-top: 2px; }
  .item .amt { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
  .item .amt small { font-weight: 500; }
  .item.empty { color: var(--muted); justify-content: center; padding: 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .loan .head { display: flex; align-items: center; gap: 8px; }
  .loan .name { font-weight: 700; font-size: 16px; flex: 1; min-width: 0; }
  .loan .meta { color: var(--muted); font-size: 13px; margin-top: 3px; line-height: 1.4; }
  .loan .meta.risk { color: var(--warn); }
  .pill { font-size: 11.5px; font-weight: 800; border-radius: 999px; padding: 3px 9px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.late { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }
  .pill.soon { color: var(--warn); border-color: var(--warn); }
  .bar { height: 7px; background: var(--surface-2); border-radius: 4px; margin: 10px 0 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .loan .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .loan .foot b { font-variant-numeric: tabular-nums; }
  .loan .hist { color: var(--muted); font-size: 12.5px; margin-top: 8px; line-height: 1.5; }
  .linkish { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 14px; padding: 8px 0; }
  .alert { display: flex; gap: 10px; align-items: flex-start; border-radius: 14px; padding: 12px 14px; margin-top: 10px; font-size: 14px; line-height: 1.4; background: var(--warn-bg); color: var(--warn); }
  .alert.late { background: var(--danger-bg); color: var(--danger); }
  .note { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 10px 2px 0; }
  .fab { position: fixed; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); max-width: 528px; margin: 0 auto;
    background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 16px; padding: 16px; font-size: 16px; font-weight: 800; z-index: 5;
    box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px; min-width: 0; }
  .kpi .l { font-size: 12px; color: var(--muted); }
  .kpi .v { font-size: 19px; font-weight: 800; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 10; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); z-index: 11; max-width: 560px; margin: 0 auto;
    border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    transform: translateY(105%); transition: transform .2s ease; max-height: 92vh; overflow-y: auto; visibility: hidden; }
  .sheet.open { transform: none; visibility: visible; }
  .sheet h3 { margin: 0 0 4px; font-size: 19px; padding-right: 48px; }
  .sheet-bar { position: sticky; top: -18px; z-index: 2; height: 0; display: flex; justify-content: flex-end; }
  .sheet-x { width: 40px; height: 40px; margin-top: -6px; margin-right: -4px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--fg); font-size: 18px; font-weight: 700; display: grid; place-items: center; }
  .sheet .cur { color: var(--muted); font-size: 13.5px; margin-bottom: 12px; line-height: 1.45; }
  .sheet label.f { display: block; font-size: 12.5px; color: var(--muted); font-weight: 700; margin: 4px 0 6px; }
  .sheet input, .sheet select { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 12px; font: inherit; font-size: 17px; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
  .sheet input[type=range] { padding: 0; border: 0; background: none; accent-color: var(--accent); }
  .two { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 8px 15px; font-size: 15px; font-weight: 600; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .row { display: flex; gap: 8px; margin-top: 4px; }
  .opfield { display: flex; gap: 6px; align-items: stretch; margin-bottom: 12px; }
  .opfield input { margin: 0 !important; flex: 1; min-width: 0; }
  .opbtn { flex: none; width: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
    display: grid; place-items: center; padding: 0; }
  .opbtn svg { width: 20px; height: 20px; }
  .opbtn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .opbtn[data-op="add"][aria-pressed="true"], .opbtn[data-sign="1"][aria-pressed="true"] { background: var(--ok); color: #fff; border-color: var(--ok); }
  .opbtn[data-op="sub"][aria-pressed="true"], .opbtn[data-sign="-1"][aria-pressed="true"] { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn { flex: 1; border: 0; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 700; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); }
  .btn.ghost { background: var(--surface-2); border: 1px solid var(--line); }
  .btn.danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
  .info { border-radius: 12px; padding: 11px 13px; font-size: 13.5px; line-height: 1.45; margin: 0 0 12px; background: var(--warn-bg); color: var(--warn); }
  .info.bad { background: var(--danger-bg); color: var(--danger); }
  .info.ok { background: var(--accent-soft); color: var(--accent); }
  .calc { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; background: var(--bg); border-radius: 12px; padding: 12px 14px; margin: 4px 0 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .calc span:nth-child(even) { text-align: right; font-weight: 600; }
  .calc small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  .calc .tot { font-weight: 800; font-size: 16px; }
  .stack { display: grid; gap: 8px; }
  .auth { position: fixed; inset: 0; z-index: 15; background: var(--bg); overflow-y: auto; }
  .auth .box { max-width: 400px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top, 0px)) 20px 40px; }
  .auth .logo { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 16px; }
  .auth h2 { font-size: 26px; margin: 0 0 4px; display: block; }
  .auth p { color: var(--muted); margin: 0 0 22px; line-height: 1.45; }
  .auth label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  .auth input { width: 100%; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 14px 12px; font-size: 16px; margin-bottom: 14px; }
  .auth .btn { width: 100%; margin-top: 4px; }
  .auth .alt { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .auth .alt button { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 6px 0; }
  .auth .pk-btn { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 6px; }
  .auth .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 14px 0; }
  .auth .or::before, .auth .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .auth .msg { border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; line-height: 1.4; background: var(--surface-2); }
  .auth .msg.err { background: var(--danger-bg); color: var(--danger); }
  .lock { position: fixed; inset: 0; z-index: 18; background: var(--bg); display: grid; place-items: center; padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px)); text-align: center; overflow-y: auto; }
  .lock .box { max-width: 320px; width: 100%; }
  .lock img { width: 60px; height: 60px; border-radius: 15px; margin-bottom: 12px; }
  .lock h2 { display: block; font-size: 21px; margin: 0 0 6px; }
  .lock p { color: var(--muted); margin: 0 0 18px; line-height: 1.45; font-size: 14px; min-height: 20px; }
  .lock p.err { color: var(--danger); font-weight: 600; }
  .dots { display: flex; justify-content: center; gap: 14px; margin: 4px 0 26px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--fg); }
  .dots i.on { background: var(--fg); }
  .dots.shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px 22px; justify-content: center; }
  .pad button { width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 28px; font-weight: 500; color: var(--fg); display: grid; place-items: center; }
  .pad button:active { background: var(--line); }
  .pad button.ghost { background: transparent; }
  .pad button svg { width: 30px; height: 30px; }
  .lock .alt { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 18px 0 0; }
  .toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -160%);
    background: var(--accent); color: var(--accent-fg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; z-index: 20;
    transition: transform .2s; max-width: calc(100% - 32px); }
  .toast.show { transform: translate(-50%, 0); }
  .toast.err { background: var(--danger); color: #fff; }
  /* ---------- Version ordinateur : menu à gauche, contenu sur deux colonnes ---------- */
  .cols { display: block; }
  @media (min-width: 900px) {
    body { font-size: 15.5px; }
    .wrap { max-width: 1200px; padding-inline: 32px; display: grid; grid-template-columns: 210px minmax(0, 1fr); column-gap: 36px;
      grid-template-areas: "head head" "nav main"; padding-block: 28px 60px; }
    .wrap > header { grid-area: head; margin-bottom: 22px; }
    header h1 { font-size: 30px; }
    .tabs { grid-area: nav; display: flex; flex-direction: column; gap: 4px; background: none; padding: 0; position: sticky; top: 28px; align-self: start; }
    .tab { text-align: left; padding: 12px 14px; font-size: 15px; border-radius: 12px; }
    .tab:hover { background: var(--surface-2); color: var(--fg); }
    .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); box-shadow: none; }
    .wrap > section { grid-column: 2; }
    .cols { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 0 28px; align-items: start; }
    .cols > .col-a { position: sticky; top: 28px; }
    .cols > .col-b > h2:first-child { margin-top: 0; }
    .hero .big { font-size: 40px; }
    .item:hover, .card.loan:hover { background: var(--surface-2); }
    .fab { left: auto; right: max(32px, calc((100vw - 1200px) / 2 + 32px)); bottom: 28px; max-width: none; width: auto; margin: 0; padding: 14px 22px; }
    .sheet { top: 50%; bottom: auto; left: 50%; right: auto; width: 560px; max-width: calc(100vw - 48px); margin: 0;
      border-radius: 20px; max-height: 86vh; transform: translate(-50%, -46%); opacity: 0; transition: transform .18s ease, opacity .18s ease; }
    .sheet.open { transform: translate(-50%, -50%); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .sheet, .toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Zakat</h1>
      <div class="sub" id="status">Données sur cet appareil</div>
    </div>
    <div class="hbtns">
      <button class="icon-btn" id="refreshBtn" aria-label="Actualiser les cours">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Réglages">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="comptes" aria-selected="true">Comptes</button>
    <button class="tab" role="tab" data-tab="credits" aria-selected="false">Crédits</button>
    <button class="tab" role="tab" data-tab="zakat" aria-selected="false">Zakat</button>
  </nav>
  <section id="p-comptes"></section>
  <section id="p-credits" hidden></section>
  <section id="p-zakat" hidden></section>
</div>

<button class="fab" id="fab">＋ Ajouter un compte</button>
<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<div class="auth" id="auth" hidden>
  <div class="box">
    <img class="logo" src="icon-192.png" alt="">
    <h2 id="aTitle">Connexion</h2>
    <p id="aSub">Connecte-toi pour retrouver tes comptes sur ton téléphone et sur ordinateur.</p>
    <div class="msg" id="aMsg" hidden></div>
    <button class="btn primary pk-btn" id="aPasskey" type="button" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9v1.5M15 9v1.5M12 9v4.5h-1"/><path d="M9.5 16a3.5 3.5 0 0 0 5 0"/></svg>
      Se connecter avec Face ID
    </button>
    <div class="or" id="aOr" hidden><span>ou avec ton mot de passe</span></div>
    <form id="aForm" novalidate>
      <div id="aEmailRow"><label for="aEmail">Email</label>
      <input id="aEmail" type="email" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>
      <div id="aPassRow"><label for="aPass">Mot de passe</label>
      <input id="aPass" type="password" autocomplete="current-password" minlength="8" required></div>
      <button class="btn primary" id="aSubmit" type="submit">Se connecter</button>
    </form>
    <div class="alt"><button id="aSwitch" type="button">Créer un compte</button><button id="aForgot" type="button">Mot de passe oublié ?</button></div>
  </div>
</div>

<div class="lock" id="lock" hidden>
  <div class="box">
    <img src="icon-192.png" alt="">
    <h2 id="lkTitle">Zakat est verrouillée</h2>

      <button type="button" data-k="0">0</button>
      <button type="button" class="ghost" data-k="del" aria-label="Effacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m16 9-5 5M11 9l5 5"/></svg></button>
    </div>

</div>

<script src="config.js"></script>
<script src="engine.js"></script>
<script>
(() => {
  "use strict";
  const Z = window.ZakatEngine;
  const CFG = window.ZAKAT_CONFIG || {};
  const CLOUD = !!(CFG.supabaseUrl && CFG.supabaseKey);

  // ================= BASE DE DONNÉES (IndexedDB, dans le téléphone) =================
  const DB_NAME = "zakat-app", DB_VER = 3;
  const DATA_STORES = ["accounts", "loans", "payments", "debts", "settings", "years", "snapshots", "movements"];
  let idb = null;
  function openDb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, DB_VER);
      r.onupgradeneeded = () => {
        const d = r.result;
        DATA_STORES.forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: "id" }); });
        if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta", { keyPath: "k" });
        if (!d.objectStoreNames.contains("outbox")) d.createObjectStore("outbox", { keyPath: "key" }); // modifications à envoyer au serveur
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  const tx = (store, mode, fn) => new Promise((res, rej) => {
    const t = idb.transaction(store, mode); const s = t.objectStore(store); const out = fn(s);
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  const getAll = store => tx(store, "readonly", s => s.getAll());
  const queue = (store, id, data, deleted) => !CLOUD ? Promise.resolve() :
    tx("outbox", "readwrite", s => s.put({ key: store + "/" + id, store, id: String(id), data: data || {}, deleted: !!deleted }))
      .then(() => cloud.schedule(1200)).catch(() => {});
  const put = async (store, v) => { await tx(store, "readwrite", s => s.put(v)); queue(store, v.id, v, false); };
  const del = async (store, id) => { await tx(store, "readwrite", s => s.delete(id)); queue(store, id, null, true); };
  async function setMeta(k, v) { S.meta[k] = v; await tx("meta", "readwrite", s => (v === undefined ? s.delete(k) : s.put({ k, v }))); }

  // État en mémoire (copie de la base)
  const DEFAULT_SETTINGS = { id: "main", ref: "EUR", nisabRef: "gold", surplusCents: 0, surplusCur: "EUR", hawlStart: null, hawlEvents: [], mode: "yearly", lotsStart: null };
  const S = { accounts: [], loans: [], payments: [], debts: [], years: [], snapshots: [], movements: [], settings: Object.assign({}, DEFAULT_SETTINGS), meta: {} };
  async function loadAll() {
    const [accounts, loans, payments, debts, settings, meta, years, snapshots, movements] = await Promise.all(["accounts", "loans", "payments", "debts", "settings", "meta", "years", "snapshots", "movements"].map(getAll));
    S.movements = movements.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.created || "") < (b.created || "") ? -1 : 1));
    S.years = years.sort((a, b) => (a.start < b.start ? -1 : 1));
    S.snapshots = snapshots.sort((a, b) => (a.id < b.id ? -1 : 1));
    const byDate = (a, b) => (a.created || "") < (b.created || "") ? -1 : 1;
    S.accounts = accounts.sort(byDate); S.loans = loans.sort(byDate);
    S.payments = payments.sort((a, b) => (a.date < b.date ? 1 : -1)); S.debts = debts.sort(byDate);
    S.settings = Object.assign({}, DEFAULT_SETTINGS, settings.find(x => x.id === "main") || {});
    S.meta = Object.fromEntries(meta.map(m => [m.k, m.v]));
  }
  const saveSettings = patch => { S.settings = Object.assign({}, S.settings, patch); return put("settings", S.settings); };

  // ================= OUTILS =================
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const pad = n => String(n).padStart(2, "0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayIso = () => iso(new Date());
  const fromIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const dfr = s => s ? fromIso(s).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) : "";
  const daysTo = s => Math.round((fromIso(s) - fromIso(todayIso())) / 86400000);
  const parse = s => Number(String(s).replace(/[\s  €]/g, "").replace(",", "."));
  const toCents = s => { const n = parse(s); return isFinite(n) ? Math.round(n * 100) : NaN; };
  // Devises : les principales, puis celles des pays membres de l'OCI (classées par pays)
  const CUR_MAIN = [["EUR","Euro"],["USD","Dollar américain"],["GBP","Livre sterling"],["CHF","Franc suisse"],["CAD","Dollar canadien"],["AUD","Dollar australien"],["JPY","Yen japonais"],["CNY","Yuan chinois"]];
  const CUR_MUSLIM = [["AFN","Afghanistan · Afghani"],["ALL","Albanie · Lek"],["DZD","Algérie · Dinar"],["SAR","Arabie saoudite · Riyal"],["AZN","Azerbaïdjan · Manat"],["BHD","Bahreïn · Dinar"],["BDT","Bangladesh · Taka"],["BAM","Bosnie · Mark"],["BND","Brunei · Dollar"],["XOF","Afrique de l'Ouest · Franc CFA (BCEAO)"],["XAF","Afrique centrale · Franc CFA (BEAC)"],["KMF","Comores · Franc"],["DJF","Djibouti · Franc"],["EGP","Égypte · Livre"],["AED","Émirats arabes unis · Dirham"],["GMD","Gambie · Dalasi"],["GNF","Guinée · Franc"],["GYD","Guyana · Dollar"],["IDR","Indonésie · Roupie"],["IQD","Irak · Dinar"],["IRR","Iran · Rial"],["JOD","Jordanie · Dinar"],["KZT","Kazakhstan · Tenge"],["KGS","Kirghizistan · Som"],["KWD","Koweït · Dinar"],["LBP","Liban · Livre"],["LYD","Libye · Dinar"],["MYR","Malaisie · Ringgit"],["MVR","Maldives · Rufiyaa"],["MAD","Maroc · Dirham"],["MRU","Mauritanie · Ouguiya"],["MZN","Mozambique · Metical"],["NGN","Nigeria · Naira"],["OMR","Oman · Rial"],["UGX","Ouganda · Shilling"],["UZS","Ouzbékistan · Sum"],["PKR","Pakistan · Roupie"],["QAR","Qatar · Riyal"],["SLE","Sierra Leone · Leone"],["SOS","Somalie · Shilling"],["SDG","Soudan · Livre"],["SRD","Suriname · Dollar"],["SYP","Syrie · Livre"],["TJS","Tadjikistan · Somoni"],["TND","Tunisie · Dinar"],["TMT","Turkménistan · Manat"],["TRY","Turquie · Livre"],["YER","Yémen · Rial"]];
  const CURRENCIES = [...CUR_MAIN, ...CUR_MUSLIM].map(c => c[0]);
  const curOptions = sel => `<optgroup label="Principales">${CUR_MAIN.map(([c, n]) => `<option value="${c}"${c === sel ? " selected" : ""}>${c} · ${n}</option>`).join("")}</optgroup>`
    + `<optgroup label="Pays musulmans">${CUR_MUSLIM.map(([c, n]) => `<option value="${c}"${c === sel ? " selected" : ""}>${c} · ${n}</option>`).join("")}</optgroup>`;
  const SYM = { EUR: "€", MAD: "DH", USD: "$", GBP: "£", CHF: "CHF", JPY: "¥", CNY: "¥", SAR: "SAR", AED: "AED", TRY: "₺" };
  const money = (cents, cur) => (cents / 100).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " " + (SYM[cur || S.settings.ref] || cur);
  const inputVal = cents => cents ? (cents / 100).toFixed(2).replace(".", ",") : "";
  // Suggestions seulement : chacun peut écrire le nom de n'importe quelle banque.
  // [devise proposée] — la couleur de la pastille est calculée à partir du nom.
  const BANK_SUGGESTIONS = {
    EUR: ["BNP Paribas", "Société Générale", "Crédit Agricole", "Banque Populaire", "Caisse d'Épargne", "LCL", "La Banque Postale", "CIC", "Crédit Mutuel",
      "BoursoBank (Boursorama)", "Fortuneo", "Hello bank!", "Monabanq", "Ma French Bank", "Shine", "Qonto", "N26", "Revolut", "Wise", "PayPal", "Lydia / Sumeria", "Nickel", "Trade Republic"],
    MAD: ["Attijariwafa bank", "Banque Populaire (Maroc)", "CIH Bank", "Bank of Africa (BMCE)", "Société Générale Maroc", "Crédit du Maroc", "BMCI", "Al Barid Bank", "CFG Bank", "Umnia Bank", "Bank Assafa", "Al Akhdar Bank", "Dar Al Amane"],
    "": ["Espèces", "Coffre / épargne à la maison"]
  };
  const suggestCurrency = name => { for (const [c, list] of Object.entries(BANK_SUGGESTIONS)) if (c && list.includes(name)) return c; return null; };
  const AV_COLORS = ["#1b3a8c", "#b3261e", "#1f6b52", "#7a3e9d", "#c25b00", "#0f6e8a", "#5b6b64", "#9a1f5b", "#3f5f1f", "#191c1f"];
  const avColor = n => { let h = 0; for (const ch of String(n)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return AV_COLORS[h % AV_COLORS.length]; };
  const initials = n => { const w = String(n).replace(/[()!/]/g, " ").trim().split(/\s+/).filter(Boolean); return ((w[0] || "?")[0] + (w[1] ? w[1][0] : (w[0] || "")[1] || "")).toUpperCase(); };
  const TYPES = { cash: "Compte", gold: "Or", silver: "Argent", crypto: "Crypto" };
  const CATEGORIES = ["Pauvres", "Nécessiteux", "Collecteurs de la zakat", "Ceux dont on rapproche les cœurs", "Affranchissement", "Endettés", "Dans le sentier d'Allah", "Voyageur en difficulté"];
  const RELATIONS = [
    ["none", "Aucun lien familial", null],
    ["relative", "Proche non à ma charge (frère, sœur, oncle…)", ["ok", "Autorisé : la zakat à un proche dans le besoin, non à ta charge, unit aumône et lien familial."]],
    ["husband", "Mon mari (je suis son épouse)", ["", "École malikite : déconseillé mais valable ; permis sans divergence si c'est pour payer ses dettes."]],
    ["dependent", "Personne à ma charge (parent, enfant, épouse)", ["bad", "Interdit : on ne verse pas sa zakat aux personnes dont on a la charge."]]
  ];
  // ---------- Calendrier hégirien (Umm al-Qura) ----------
  const HIJ_FMT = new Intl.DateTimeFormat("fr-FR-u-ca-islamic-umalqura", { day: "numeric", month: "long", year: "numeric" });
  const HIJ_NUM = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn", { day: "numeric", month: "numeric", year: "numeric" });
  const hijri = s => HIJ_FMT.format(fromIso(s)).replace(/\s*AH$/, "").replace(/ hégire$/, "");
  const hparts = d => { const o = {}; HIJ_NUM.formatToParts(d).forEach(p => { if (p.type !== "literal") o[p.type] = Number(p.value); }); return o; };
  const addDaysIso = (s, n) => { const d = fromIso(s); d.setDate(d.getDate() + n); return iso(d); };
  // Échéance du hawl : même jour du calendrier hégirien, un an plus tard
  function hawlEnd(start) {
    const p0 = hparts(fromIso(start));
    let best = null;
    for (let n = 340; n <= 370; n++) {
      const p = hparts(fromIso(addDaysIso(start, n)));
      if (p.year === p0.year + 1 && p.month === p0.month) {
        if (p.day === p0.day) return addDaysIso(start, n);
        if (p.day < p0.day) best = addDaysIso(start, n); // mois plus court : dernier jour du mois
      }
    }
    return best ? addDaysIso(best, 1) : addDaysIso(start, 354);
  }
  const dboth = s => `${hijri(s)} (${dfr(s)})`;

  function toast(msg, err) {
    const t = $("toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
    clearTimeout(t._h); t._h = setTimeout(() => (t.className = "toast"), 2600);
  }
  function openSheet(html, focusId) {
    const s = $("sheet");
    s.innerHTML = `<div class="sheet-bar"><button class="sheet-x" type="button" aria-label="Fermer">✕</button></div>` + html;
    s.querySelector(".sheet-x").onclick = closeSheet;
    $("backdrop").hidden = false;
    requestAnimationFrame(() => s.classList.add("open"));
    if (focusId) setTimeout(() => { const el = $(focusId); if (el) el.focus(); }, 230);
  }
  function closeSheet() { $("sheet").classList.remove("open"); $("backdrop").hidden = true; }
  $("backdrop").onclick = closeSheet;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && $("sheet").classList.contains("open")) closeSheet(); });
  const bindChips = (root, attr, onPick) => root.querySelectorAll(`[${attr}]`).forEach(b => (b.onclick = () => {
    root.querySelectorAll(`[${attr}]`).forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false")); onPick(b.getAttribute(attr));
  }));

  // ================= COURS DE L'OR ET DES DEVISES =================
  // Service gratuit sans clé : https://github.com/fawazahmed0/exchange-api (mis à jour chaque jour)
  const TROY_OZ_G = 31.1034768;
  let market = null, marketBusy = false;
  async function fetchMarket(ref) {
    const c = ref.toLowerCase();
    const urls = [`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${c}.json`,
      `https://latest.currency-api.pages.dev/v1/currencies/${c}.json`];
    let last;
    for (const u of urls) {
      try {
        const r = await fetch(u, { cache: "no-store" });
        if (!r.ok) { last = new Error("HTTP " + r.status); continue; }
        const j = await r.json(), x = j[c];
        const rates = {};
        CURRENCIES.forEach(k => { const v = x[k.toLowerCase()]; if (k !== ref && v) rates[k] = 1 / v; });
        return { ref, date: j.date, goldCents: Math.round(100 / x.xau / TROY_OZ_G), silverCents: Math.round(100 / x.xag / TROY_OZ_G), rates };
      } catch (e) { last = e; }
    }
    throw last || new Error("Cours indisponibles");
  }
  async function loadMarket(force) {
    const ref = S.settings.ref, cached = S.meta["market_" + ref];
    if (cached) market = cached;
    const complete = cached && cached.rates && Object.keys(cached.rates).length >= CURRENCIES.length - 6; // anciens cours avec 3 devises seulement : on recharge
    if (marketBusy || (!force && complete && cached.date === todayIso() && cached.fetched && Date.now() - cached.fetched < 6 * 3600e3)) { renderAll(); return; }
    marketBusy = true; $("refreshBtn").classList.add("spin");
    try {
      const m = await fetchMarket(ref); m.fetched = Date.now();
      market = m; await setMeta("market_" + ref, m);
      if (force) toast("Cours mis à jour");
    } catch (e) {
      if (force || !market) toast(market ? "Cours non actualisés : derniers cours utilisés" : "Impossible de récupérer les cours (internet ?)", true);
    } finally { marketBusy = false; $("refreshBtn").classList.remove("spin"); renderAll(); }
  }
  const rate = cur => { if (!market) return cur === S.settings.ref ? 1 : null; try { return Z.rateFor(market, cur); } catch (_) { return null; } };
  const toRef = (cents, cur) => { const r = rate(cur); return r == null ? null : Math.round(cents * r); };

  // ---------- Mouvements (wallet de zakat) ----------
  // Valeur soumise d'un compte, en devise de référence (bijou porté = 0)
  const RISK_MAX = 20; // risque ≤ 20 % : prêt sûr, compté chaque année dans la zakat
  const loanSure = l => (l.risk || 0) <= RISK_MAX;
  // Valeur d'un compte en devise de référence, pour l'affichage (or porté compris)
  function fullValue(a) {
    if (a.type === "gold") return market ? Math.round(Z.pureGrams(a) * market.goldCents) : null;
    if (a.type === "silver") return market ? Math.round(Z.pureGrams(a) * market.silverCents) : null;
    return toRef(a.cents || 0, a.currency);
  }
  function valueRef(a) {
    if (!a || a.noZakat) return 0;
    if (a.type === "gold") return a.usage === "worn" || !market ? 0 : Math.round(Z.pureGrams(a) * market.goldCents);
    if (a.type === "silver") return market ? Math.round(Z.pureGrams(a) * market.silverCents) : 0;
    return toRef(a.cents || 0, a.currency) || 0;
  }
  const walletMode = () => S.settings.mode === "lots";
  const nisabToday = () => market ? Z.nisabCents(market, S.settings.nisabRef) : 0;
  async function recordMove(date, cents, label) {
    if (!walletMode() || !cents || !isFinite(cents)) return;
    await put("movements", { id: uid(), date, cents: Math.round(cents), ref: S.settings.ref, nisab: nisabToday(), label, created: new Date().toISOString() });
  }
  // Première tranche : l'argent présent au début du suivi
  async function ensureInit() {
    if (!walletMode() || !market || !S.settings.lotsStart) return false;
    const cur = S.movements.find(m => m.id === "init");
    if (cur && cur.date === S.settings.lotsStart) return false;
    const total = cur ? cur.cents : S.accounts.reduce((t, a) => t + valueRef(a), 0);
    await put("movements", { id: "init", date: S.settings.lotsStart, cents: total, ref: cur ? cur.ref : S.settings.ref, nisab: nisabToday(), label: "Argent de départ", created: "0" });
    await loadAll(); return true;
  }
  const moveRef = m => m.ref === S.settings.ref ? m.cents : (toRef(m.cents, m.ref) || 0);

  // ================= CALCUL =================
  const loanAssets = () => S.loans.filter(l => l.outstanding > 0)
    .map(l => ({ id: l.id, name: "Prêt à " + l.name, type: "loan", cents: l.outstanding, currency: l.currency, countYearly: loanSure(l) }));
  // Zakat ajoutée au remboursement : seulement pour les prêts à risque (> 20 %), toutes les années écoulées
  const repayZakatOf = (l, p) => loanSure(l) ? { years: 0, cents: 0 } : Z.zakatForPeriod(p.cents, l.date, p.date, hawlEnd);
  // Wallet : un prêt sûr compte comme de l'argent toujours à toi (mouvements virtuels)
  const loanMoves = () => {
    const out = [];
    S.loans.filter(loanSure).forEach(l => {
      out.push({ date: l.date, cents: toRef(l.initial, l.currency) || 0 });
      (l.repayments || []).forEach(p => out.push({ date: p.date, cents: -(toRef(p.cents, l.currency) || 0) }));
    });
    return out;
  };
  const hawlStart = () => S.settings.hawlStart;
  function compute() {
    if (!market) return null;
    const st = S.settings;
    const r = Z.calculate([...S.accounts, ...loanAssets()], S.debts, market, {
      madhhab: "maliki", nisabRef: st.nisabRef, surplusCents: toRef(st.surplusCents || 0, st.surplusCur) || 0 });
    // Zakat due : années de zakat clôturées (montant figé à l'échéance) + remboursements de prêts reçus.
    // Les versements viennent en déduction, du plus ancien au plus récent.
    r.repayItems = [];
    S.loans.forEach(l => (l.repayments || []).forEach(p => { const z = repayZakatOf(l, p); if (z.cents > 0)
      r.repayItems.push({ date: p.date, label: "Remboursement de " + l.name, years: z.years, cents: toRef(z.cents, l.currency) || 0 }); }));
    r.repayZakat = r.repayItems.reduce((s, x) => s + x.cents, 0);
    if (walletMode()) {
      r.wallet = Z.computeLots([...S.movements.map(m => ({ date: m.date, cents: moveRef(m), nisab: m.nisab ? (m.ref === S.settings.ref ? m.nisab : toRef(m.nisab, m.ref)) : 0 })), ...loanMoves()],
        { today: todayIso(), hawlEnd, debtCents: r.deductibleCents });
    }
    r.yearsDue = S.years.reduce((s, y) => s + (toRef(y.dueCents, y.ref) || 0), 0);
    r.totalDue = r.yearsDue + r.repayZakat + (r.wallet ? r.wallet.dueCents : 0);
    r.paid = S.payments.reduce((s, p) => s + (toRef(p.cents, p.currency) || 0), 0);
    r.remaining = Math.max(0, r.totalDue - r.paid);
    r.loansRef = S.loans.reduce((s, l) => s + (toRef(l.outstanding, l.currency) || 0), 0);
    r.atRisk = S.loans.reduce((s, l) => s + Math.round((toRef(l.outstanding, l.currency) || 0) * (l.risk || 0) / 100), 0);
    r.loansSure = S.loans.filter(loanSure).reduce((s, l) => s + (toRef(l.outstanding, l.currency) || 0), 0);
    r.loansRisky = r.loansRef - r.loansSure;
    r.accountsTotal = S.accounts.reduce((s, a) => s + (fullValue(a) || 0), 0);
    return r;
  }
  const accountValue = a => fullValue(a);

  // ================= AFFICHAGE =================
  let tab = "comptes";
  const FAB = { comptes: "＋ Ajouter un compte", credits: "＋ Nouveau prêt", zakat: "＋ Nouveau versement" };
  function setTab(t) {
    tab = t;
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t ? "true" : "false"));
    ["comptes", "credits", "zakat"].forEach(n => ($("p-" + n).hidden = n !== t));
    $("fab").textContent = FAB[t];
    try { localStorage.setItem("zakat.tab", t); } catch (_) {}
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".tab").forEach(b => (b.onclick = () => setTab(b.dataset.tab)));

  function ratesLine() {
    if (!market) return `<div class="rates">Récupération des cours du jour…</div>`;
    const ref = S.settings.ref, other = ref === "MAD" ? "EUR" : "MAD";
    const r = 1 / Z.rateFor(market, other);
    return `<div class="rates">Cours du ${dfr(market.date)} · or ${money(market.goldCents)}/g · 1 ${ref} = ${r.toLocaleString("fr-FR", { maximumFractionDigits: 4 })} ${other}</div>`;
  }


  // ================= EXPLICATIONS =================
  const HELP = {
    loans: ["Crédits et zakat", `
      <p>L'argent que tu as prêté t'appartient toujours : il compte dans ton patrimoine. La façon de le compter dépend du <b>risque</b> que tu indiques pour chaque prêt.</p>

      <div class="info"><b>Risque de plus de 20 % : prêt douteux</b><br>Tu n'es pas sûr de revoir cet argent. Il n'est <b>pas compté</b> tant qu'il n'est pas remboursé. Le jour où tu le récupères, l'appli ajoute la zakat de <b>toute la période</b> : 2,5 % pour chaque année lunaire complète écoulée depuis le prêt.</div>

    exclude: ["Ne pas compter un compte", `

  const riskPill = l => l.outstanding <= 0 ? "" : loanSure(l)
    ? `<span class="pill ok">Compté dans la zakat</span>` : `<span class="pill soon">Hors zakat jusqu'au remboursement</span>`;
  const riskText = r => r <= RISK_MAX
    ? `<b>Risque ${r} % : prêt sûr.</b> Compté chaque année dans ta zakat, comme de l'argent sur ton compte. Rien de plus à payer au remboursement.`
    : `<b>Risque ${r} % : prêt douteux.</b> Pas compté pendant le prêt. Au remboursement, l'appli ajoute la zakat de toutes les années écoulées (2,5 % par année lunaire).`;

  // Mobile : une colonne. Ordinateur : résumé à gauche, listes à droite (coupure au premier titre).
  function twoCol(html) {
    const i = html.indexOf("<h2");
    return i < 0 ? `<div class="cols"><div class="col-a">${html}</div></div>`
      : `<div class="cols"><div class="col-a">${html.slice(0, i)}</div><div class="col-b">${html.slice(i)}</div></div>`;
  }
  function renderAccounts(r) {
    const ref = S.settings.ref, other = ref === "MAD" ? "EUR" : "MAD";
    const total = r ? r.accountsTotal : null;
    const otherVal = r && market ? Math.round(total / Z.rateFor(market, other)) : null;
    const items = S.accounts.map(a => {
      const bank = a.type === "cash" ? (a.name || a.bank) : null;
      const av = bank ? `<span class="av" style="background:${avColor(bank)}">${esc(initials(bank))}</span>`
        : `<span class="av soft">${esc(TYPES[a.type].slice(0, 2))}</span>`;
      const ex = r && r.excluded.find(e => e.id === a.id);
      let sub = a.type === "gold" ? `${String(a.grams).replace(".", ",")} g · ${a.carats} carats${a.usage === "worn" ? " · porté" : ""}`
        : a.type === "silver" ? `${String(a.grams).replace(".", ",")} g` : a.currency !== ref ? money(a.cents, a.currency) : TYPES[a.type];
      if (a.noZakat) sub += " · hors zakat"; else if (ex) sub += " · non soumis à la zakat";
      const val = accountValue(a);
      return `<button class="item" data-acc="${esc(a.id)}">${av}<span class="mid"><div>${esc(a.name)}</div><small>${esc(sub)}</small></span>
        <span class="amt">${val == null ? "…" : money(val)}</span></button>`;
    }).join("") || `<div class="item empty">Ajoute ton premier compte avec le bouton en bas.</div>`;
    $("p-comptes").innerHTML = twoCol(`
      <div class="hero">
        <div class="top"><span class="lbl">Total de mes comptes</span></div>
        <div class="big">${total == null ? "…" : money(total)}</div>
        <div class="line"><span>Soit environ</span><b>${otherVal == null ? "…" : money(otherVal, other)}</b></div>
        <div class="line"><span>Crédits (argent qu'on me doit)</span><b>${r ? money(r.loansRef) : "…"}</b></div>
        <div class="line"><span>Patrimoine total</span><b>${r ? money(total + r.loansRef) : "…"}</b></div>

      <div class="list">${items}</div>

          <span class="av soft">${esc(l.name.slice(0, 2).toUpperCase())}</span>
          <span class="mid"><div>${esc(l.name)}</div><small>Risque ${l.risk || 0} % · ${loanSure(l) ? "compté dans la zakat" : "hors zakat jusqu'au remboursement"}</small></span>
          <span class="amt">${money(toRef(l.outstanding, l.currency) || 0)}${l.currency !== S.settings.ref ? `<small>${money(l.outstanding, l.currency)}</small>` : ""}</span></button>`).join("")
        || `<div class="item empty">Aucun crédit en cours.</div>`}</div>
      ${r && S.loans.some(l => l.outstanding > 0) ? `<p class="note">Comptés dans la zakat : ${money(r.loansSure)} · hors zakat jusqu'au remboursement : ${money(r.loansRisky)}.</p>` : ""}`);
    $("accLoanHelp").onclick = () => helpSheet("loans");
    $("p-comptes").querySelectorAll("[data-acc-loan]").forEach(b => (b.onclick = () => loanSheet(S.loans.find(l => l.id === b.dataset.accLoan))));
    $("p-comptes").querySelectorAll("[data-acc]").forEach(b => (b.onclick = () => accountSheet(S.accounts.find(a => a.id === b.dataset.acc))));
  }

  const loanState = l => {
    if (l.outstanding <= 0) return ["ok", "Remboursé"];
    if (l.due) { const d = daysTo(l.due); if (d < 0) return ["late", "En retard"]; if (d <= 7) return ["soon", "Bientôt"]; }
    return null;
  };
  function renderLoans(r) {
    const active = S.loans.filter(l => l.outstanding > 0);
    const alerts = active.filter(l => { const s = loanState(l); return s && (s[0] === "late" || s[0] === "soon"); });
    const cards = S.loans.map(l => {
      const st = loanState(l), repaid = l.initial - l.outstanding;
      const hist = (l.repayments || []).map(p => { const z = repayZakatOf(l, p);
        return `${dfr(p.date)} : ${money(p.cents, l.currency)} remboursés${z.cents ? ` · zakat ${money(z.cents, l.currency)} (${z.years} an${z.years > 1 ? "s" : ""})` : ""}`; }).join("<br>");
      return `<div class="card loan">
        <div class="head"><span class="name">${esc(l.name)}</span>${st ? `<span class="pill ${st[0]}">${st[1]}</span>` : ""}</div>

        <div class="meta${!loanSure(l) ? " risk" : ""}">Remboursement prévu : ${l.due ? dfr(l.due) : "date inconnue"} · risque ${l.risk || 0} %</div>
        <div class="bar"><i style="width:${l.initial ? Math.round(repaid / l.initial * 100) : 0}%"></i></div>
        <div class="foot"><b>Reste : ${money(l.outstanding, l.currency)}</b>
          <span>${l.outstanding > 0 ? `<button class="linkish" data-repay="${esc(l.id)}">Remboursement</button> · ` : ""}<button class="linkish" data-edit-loan="${esc(l.id)}">Modifier</button></span></div>
        ${hist ? `<div class="hist">${hist}</div>` : ""}
      </div>`;
    }).join("") || `<div class="list"><div class="item empty">Aucun prêt enregistré.</div></div>`;
    $("p-credits").innerHTML = twoCol(`
      <div class="hero">
        <div class="top"><span class="lbl">Argent qu'on me doit</span></div>
        <div class="big">${r ? money(r.loansRef) : "…"}</div>
        <div class="line"><span>Crédits en cours</span><b>${active.length}</b></div>
        <div class="line"><span>Compté dans la zakat (risque ≤ 20 %)</span><b>${r ? money(r.loansSure) : "…"}</b></div>
        <div class="line"><span>Hors zakat jusqu'au remboursement</span><b>${r ? money(r.loansRisky) : "…"}</b></div>
        <div class="line"><span>Montant que tu pourrais perdre</span><b>${r ? money(r.atRisk) : "…"}</b></div>
      </div>
      ${alerts.map(l => { const late = daysTo(l.due) < 0; return `<div class="alert${late ? " late" : ""}">🔔<span>${esc(l.name)} ${late ? "devait rembourser" : "doit rembourser"} le ${dfr(l.due)} (${money(l.outstanding, l.currency)}).</span></div>`; }).join("")}
      <h2>Mes crédits accordés <button id="loanHelp">Comment ça compte ?</button></h2>
      ${cards}
      <p class="note">Risque de 0 à 20 % : le prêt est compté chaque année dans ta zakat. Au-delà de 20 % : il n'est pas compté, et la zakat de toute la période est ajoutée au remboursement.</p>`);
    $("loanHelp").onclick = () => helpSheet("loans");
    $("p-credits").querySelectorAll("[data-repay]").forEach(b => (b.onclick = () => repaySheet(S.loans.find(l => l.id === b.dataset.repay))));
    $("p-credits").querySelectorAll("[data-edit-loan]").forEach(b => (b.onclick = () => loanSheet(S.loans.find(l => l.id === b.dataset.editLoan))));
  }

  function renderZakat(r) {
    const st = S.settings, start = hawlStart(), end = start ? hawlEnd(start) : null, left = end ? daysTo(end) : null;
    const nisabLbl = st.nisabRef === "silver" ? "595 g d'argent" : "85 g d'or";
    let hero;
    if (!r) hero = `<div class="hero"><div class="top"><span class="lbl">Zakat</span></div><div class="big">…</div><div class="line"><span>Récupération des cours du jour…</span></div></div>`;
    else if (!start) hero = `<div class="hero">
        <div class="top"><span class="lbl">Année de zakat</span><span class="badge off">Sous le nisab</span></div>
        <div class="big" style="font-size:24px">Pas d'année en cours</div>
        <div class="line"><span>Patrimoine soumis</span><b>${money(r.baseCents)}</b></div>
        <div class="line"><span>Nisab du jour (${nisabLbl})</span><b>${money(r.nisabCents)}</b></div>
        <div class="line"><span>L'année de zakat commencera le jour où ton patrimoine atteindra le nisab.</span></div></div>`;
    else hero = `<div class="hero">
        <div class="top"><span class="lbl">${left <= 0 ? "Zakat de l'année · échéance atteinte" : "Zakat estimée à l'échéance"}</span><span class="badge${r.reached ? "" : " off"}">${r.reached ? "Nisab atteint" : "Sous le nisab"}</span></div>
        <div class="big">${money(r.dueCents)}</div>
        <div class="line"><span>Patrimoine soumis aujourd'hui</span><b>${money(r.baseCents)}</b></div>
        <div class="line"><span>Nisab du jour (${nisabLbl})</span><b>${money(r.nisabCents)}</b></div>
        <div class="line"><span>Échéance</span><b>${left > 0 ? "dans " + left + " j" : "aujourd'hui"}</b></div></div>`;
    const yearCard = start ? `<div class="card" style="margin-top:10px">
        <div style="font-weight:700">Année de zakat en cours</div>
        <div class="meta" style="color:var(--muted);font-size:13.5px;margin-top:4px;line-height:1.5">Début : ${dboth(start)}<br>Échéance : ${dboth(end)}</div>
        ${left <= 0 ? `<div class="info ok" style="margin:10px 0 0">L'année est terminée. Mets à jour tes soldes, puis calcule ta zakat : le montant sera figé avec les cours du jour.</div>
          <div class="row"><button class="btn primary" id="closeYear">Calculer ma zakat de l'année</button></div>`
        : `<p class="note" style="margin:8px 0 0">Montant indicatif, avec tes soldes et les cours d'aujourd'hui. Le montant définitif se calcule le jour de l'échéance.</p>`}
        <button class="linkish" id="hawlBtn">Modifier la date de début</button></div>`
      : `<div class="list" style="margin-top:10px"><button class="item" id="hawlBtn"><span class="mid"><div>Indiquer le début de mon année de zakat</div><small>Si tu connais déjà ta date (ex. 1er Ramadan)</small></span><span class="amt">›</span></button></div>`;
    const alerts = (st.hawlEvents || []).slice(-1).filter(e => daysTo(e.date) > -30 && (e.type === "broken" ? !st.hawlStart : st.hawlStart === e.date)).map(e => `<div class="alert${e.type === "broken" ? " late" : ""}">${e.type === "broken" ? "⚠️" : "✅"}<span>${esc(e.text)}</span></div>`).join("");
    const dueItems = [
      ...S.years.map(y => ({ date: y.end, label: `Zakat de l'année ${hijri(y.start).replace(/^.* (\d+)$/, "$1")}`, sub: `Calculée le ${dfr(y.closedAt)} · assiette ${money(y.baseCents, y.ref)}`, cents: toRef(y.dueCents, y.ref) || 0, year: y.id })),
      ...(r ? r.repayItems : []).map(x => ({ date: x.date, label: x.label, sub: `Zakat d'une année · ${dfr(x.date)}`, cents: x.cents }))
    ].sort((a, b) => (a.date < b.date ? -1 : 1));
    let pool = r ? r.paid : 0;
    const dueHtml = dueItems.map(it => { const used = Math.min(pool, it.cents); pool -= used; const rest = it.cents - used;
      return `<${it.year ? `button data-year="${esc(it.year)}"` : "div"} class="item"><span class="mid"><div>${esc(it.label)}</div><small>${esc(it.sub)}</small></span>
        <span class="amt">${money(it.cents)}<small>${rest > 0 ? "reste " + money(rest) : "✓ versée"}</small></span></${it.year ? "button" : "div"}>`; }).join("");
    const pays = S.payments.map(p => `<button class="item" data-pay="${esc(p.id)}">
        <span class="mid"><div>${esc(p.beneficiary || "Versement")}</div><small>${esc(p.category)} · ${dfr(p.date)}</small></span>
        <span class="amt">${money(p.cents, p.currency)}</span></button>`).join("") || `<div class="item empty">Aucun versement enregistré.</div>`;
    const debts = S.debts.map(d => `<button class="item" data-debt="${esc(d.id)}"><span class="mid"><div>${esc(d.name)}</div></span><span class="amt">${money(d.cents, d.currency)}</span></button>`).join("");
    $("p-zakat").innerHTML = twoCol(`
      ${hero}${alerts}${yearCard}
      <div class="list" style="margin-top:10px"><button class="item" id="detailBtn"><span class="mid"><div>Détail du calcul</div><small>Chaque compte, les taux appliqués, l'assiette</small></span><span class="amt">›</span></button></div>
      <h2>Zakat à verser</h2>
      <div class="kpis" style="margin-top:0">
        <div class="kpi"><div class="l">Reste à verser</div><div class="v">${r ? money(r.remaining) : "…"}</div></div>
        <div class="kpi"><div class="l">Déjà versé</div><div class="v">${r ? money(r.paid) : "…"}</div></div>
      </div>
      <div class="list" style="margin-top:10px">${dueHtml || `<div class="item empty">Rien à verser pour l'instant : la zakat de l'année sera ajoutée ici à l'échéance.</div>`}</div>
      <h2>Versements <button id="addPay">＋ Ajouter</button></h2>
      <div class="list">${pays}</div>
      <h2>Mes dettes <button id="addDebt">＋ Ajouter</button></h2>
      <div class="list">${debts || `<div class="item empty">Aucune dette enregistrée.</div>`}
        <button class="item" id="surplusBtn"><span class="mid"><div>Biens non soumis en surplus</div><small>La dette se règle d'abord sur eux (malikite)</small></span><span class="amt">${money(st.surplusCents || 0, st.surplusCur)}</span></button></div>
      ${r && S.debts.length ? `<p class="note">Dette déduite de l'assiette : ${money(r.deductibleCents)}.</p>` : ""}`);
    const P = $("p-zakat");
    P.querySelectorAll("[data-pay]").forEach(b => (b.onclick = () => paymentSheet(S.payments.find(p => p.id === b.dataset.pay))));
    P.querySelectorAll("[data-debt]").forEach(b => (b.onclick = () => debtSheet(S.debts.find(d => d.id === b.dataset.debt))));
    P.querySelectorAll("[data-year]").forEach(b => (b.onclick = () => yearSheet(S.years.find(y => y.id === b.dataset.year))));
    $("addPay").onclick = () => paymentSheet(); $("addDebt").onclick = () => debtSheet();
    $("surplusBtn").onclick = surplusSheet; $("detailBtn").onclick = () => detailSheet(r); $("hawlBtn").onclick = hawlSheet;
    if ($("closeYear")) $("closeYear").onclick = () => closeYearSheet(r);
  }

  // ---------- Écran « Wallet de zakat » : chaque somme a son propre hawl ----------

    }

      : `<div class="hero">
        <div class="top"><span class="lbl">Wallet de zakat · à verser</span><span class="badge${w.broken ? " off" : ""}">${w.broken ? "Sous le nisab" : "Nisab atteint"}</span></div>
        <div class="big">${money(r.remaining)}</div>
        <div class="line"><span>Zakat devenue due</span><b>${money(r.totalDue)}</b></div>
        <div class="line"><span>Déjà versé</span><b>${money(r.paid)}</b></div>
        <div class="line"><span>Patrimoine soumis / nisab (${nisabLbl})</span><b>${money(r.baseCents)} / ${money(r.nisabCents)}</b></div></div>`;
    const brokenAlert = w && w.broken ? `<div class="alert late">⚠️<span>Ton total est passé sous le nisab${w.brokenSince ? " le " + dfr(w.brokenSince) : ""} : selon l'école malikite, le hawl de toutes tes tranches est interrompu. Il recommencera le jour où ton total atteindra de nouveau le nisab.</span></div>` : "";
    const next = w ? w.lots.slice().sort((a, b) => (a.end < b.end ? -1 : 1)).map(l => {
      const d = daysTo(l.end);
      return `<div class="item"><span class="mid"><div>${money(l.cents)} depuis le ${fromIso(l.date).toLocaleDateString("fr-FR")}</div><small>Échéance : ${esc(dboth(l.end))}${d >= 0 ? " · dans " + d + " j" : ""}</small></span>
        <span class="amt">${money(l.zakat)}<small>de zakat</small></span></div>`; }).join("") : "";
    const dueItems = [
      ...(w ? w.due : []).map(x => ({ date: x.date, label: `Hawl de ${money(x.base)}`, sub: `Tranche du ${dfr(x.from)} · due le ${dfr(x.date)}`, cents: x.cents })),
      ...(r ? r.repayItems : []).map(x => ({ date: x.date, label: x.label, sub: `Zakat d'une année · ${dfr(x.date)}`, cents: x.cents })),
      ...S.years.map(y => ({ date: y.end, label: "Zakat de l'année (mode annuel)", sub: `Calculée le ${dfr(y.closedAt)}`, cents: toRef(y.dueCents, y.ref) || 0 }))
    ].sort((a, b) => (a.date < b.date ? -1 : 1));
    let pool = r ? r.paid : 0;
    const dueHtml = dueItems.map(it => { const used = Math.min(pool, it.cents); pool -= used; const rest = it.cents - used;
      return `<div class="item"><span class="mid"><div>${esc(it.label)}</div><small>${esc(it.sub)}</small></span>
        <span class="amt">${money(it.cents)}<small>${rest > 0 ? "reste " + money(rest) : "✓ versée"}</small></span></div>`; }).reverse().join("");
    const pays = S.payments.map(p => `<button class="item" data-pay="${esc(p.id)}">
        <span class="mid"><div>${esc(p.beneficiary || "Versement")}</div><small>${esc(p.category)} · ${dfr(p.date)}</small></span>
        <span class="amt">${money(p.cents, p.currency)}</span></button>`).join("") || `<div class="item empty">Aucun versement enregistré.</div>`;
    const moves = S.movements.slice().reverse().slice(0, 20).map(m => { const v = moveRef(m);

  // ---------- Suivi du hawl ----------
  // À chaque ouverture, l'appli note le patrimoine du jour face au nisab.
  // École malikite : si le patrimoine passe sous le nisab pendant l'année, le hawl est interrompu
  // et une nouvelle année commence le jour où il atteint de nouveau le nisab.
  let hawlChecking = false;
  async function hawlCheck(r) {
    if (!r || hawlChecking) return;
    hawlChecking = true;
    try {
      const today = todayIso(), st = S.settings, last = S.snapshots[S.snapshots.length - 1];
      if (!last || last.id !== today || last.base !== r.baseCents || last.reached !== r.reached) {
        await put("snapshots", { id: today, base: r.baseCents, nisab: r.nisabCents, ref: market.ref, reached: r.reached });
        S.snapshots = (await getAll("snapshots")).sort((a, b) => (a.id < b.id ? -1 : 1));
      }
      const ev = (type, text) => [...(st.hawlEvents || []).slice(-9), { date: today, type, text }];
      if (!st.hawlStart && r.reached) {
        await saveSettings({ hawlStart: today, hawlEvents: ev("start", `Ton patrimoine a atteint le nisab : ton année de zakat commence aujourd'hui (${hijri(today)}).`) });
        toast("Nisab atteint : ton année de zakat commence aujourd'hui"); renderAll();
      } else if (st.hawlStart && !r.reached && today < hawlEnd(st.hawlStart)) {
        await saveSettings({ hawlStart: null, hawlEvents: ev("broken", `Ton patrimoine est passé sous le nisab le ${dfr(today)} : selon l'école malikite, l'année de zakat est interrompue. Elle recommencera le jour où il atteindra de nouveau le nisab.`) });
        toast("Patrimoine sous le nisab : année de zakat interrompue", true); renderAll();
      }
    } catch (_) {} finally { hawlChecking = false; }
  }

    openSheet(`<h3>Zakat de l'année</h3>

      await put("years", y);
      // Nouvelle année : commence à l'échéance si le patrimoine est toujours au-dessus du nisab
      await saveSettings({ hawlStart: r.reached ? end : null });
      await loadAll(); closeSheet(); renderAll();
      toast(r.dueCents ? "Zakat de l'année enregistrée : " + money(r.dueCents) : "Année clôturée : pas de zakat due");

  // ================= FORMULAIRES =================
  const OPI = {
    add: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
    sub: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>`,
    set: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`
  };
  function accountSheet(a) {
    const isNew = !a;
    const d = a ? Object.assign({}, a) : { id: uid(), type: "cash", name: "", cents: 0, currency: "EUR", grams: 0, carats: 24, usage: "savings", created: new Date().toISOString() };
    let op = "add", opTyped = null; // compte existant : ajouter, retirer ou remplacer
    const draw = () => {
      const metal = d.type === "gold" || d.type === "silver";
      const unit = metal ? "g" : d.currency;
      const opBox = isNew ? "" : `<label class="f">Modifier le ${metal ? "poids" : "solde"}</label>
        <div class="cur" style="margin:-2px 0 8px">${metal ? "Poids actuel" : "Solde actuel"} : <b>${metal ? String(a.grams).replace(".", ",") + " g" : money(a.cents, a.currency)}</b> · ${op === "add" ? `ajouter (${unit})` : op === "sub" ? `retirer (${unit})` : `nouveau ${metal ? "poids" : "solde"} (${unit})`}</div>

          <button class="opbtn" type="button" data-op="set" aria-pressed="${op === "set"}" aria-label="Remplacer le ${metal ? "poids" : "solde"}">${OPI.set}</button>
        </div>
        <div class="info ok" id="fPreview" hidden></div>`;
      openSheet(`<h3>${isNew ? "Ajouter un compte" : "Modifier le compte"}</h3>
        <div class="cur">${isNew ? "Banque, espèces, or, argent ou crypto." : "Mets à jour le solde quand il change."}</div>
        ${isNew ? `<div class="chips">${Object.entries(TYPES).map(([k, t]) => `<button class="chip" data-type="${k}" aria-pressed="${d.type === k}">${t}</button>`).join("")}</div>` : ""}
        <label class="f" for="fName">${d.type === "cash" ? "Banque ou nom du compte" : "Nom"}</label>
        <input id="fName" class="small" value="${esc(d.name)}" autocomplete="off" ${d.type === "cash" ? `list="bankList" placeholder="Ex. BNP Paribas, Attijariwafa, Espèces…"` : ""}>
        ${d.type === "cash" ? `<datalist id="bankList">${Object.values(BANK_SUGGESTIONS).flat().map(b => `<option value="${esc(b)}"></option>`).join("")}</datalist>
          <div class="cur" style="margin:-6px 0 12px">Écris le nom de ta banque : des suggestions s'affichent, mais toutes les banques sont acceptées.</div>` : ""}
        ${opBox}
        ${metal ? `${isNew ? `<label class="f" for="fGrams">Poids (g)</label><input id="fGrams" inputmode="decimal" value="${d.grams ? String(d.grams).replace(".", ",") : ""}">` : ""}
          ${d.type === "gold" ? `<label class="f" for="fCarats">Carats</label><select id="fCarats">${[24, 22, 21, 18].map(c => `<option value="${c}"${c === d.carats ? " selected" : ""}>${c} carats</option>`).join("")}</select>
          <label class="f">Usage</label><div class="chips"><button class="chip" data-usage="savings" aria-pressed="${d.usage !== "worn"}">Épargne</button><button class="chip" data-usage="worn" aria-pressed="${d.usage === "worn"}">Porté</button></div>
          <div class="info" id="usageInfo">${d.usage === "worn" ? "Bijou porté habituellement : non soumis à la zakat selon l'école malikite." : "Compté dans la zakat, au poids d'or pur."}</div>` : ""}`
        : isNew ? `<label class="f" for="fAmt">Solde</label><div class="two"><input id="fAmt" inputmode="decimal" placeholder="0,00" value="${inputVal(d.cents)}">
          <select id="fCur">${curOptions(d.currency)}</select></div>`
          : `<label class="f" for="fCur">Devise</label><select id="fCur">${curOptions(d.currency)}</select>`}
        <button class="toggle" id="fNoZ" type="button" aria-pressed="${!!d.noZakat}" style="display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;text-align:left;margin-bottom:6px">
          <span style="flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--accent);display:grid;place-items:center;background:${d.noZakat ? "var(--accent)" : "transparent"};color:var(--accent-fg);font-weight:900">${d.noZakat ? "✓" : ""}</span>
          <span><b>Ne pas compter dans la zakat</b><small style="display:block;color:var(--muted);font-size:12.5px">Ex. compte de cotisations, argent qui n'est pas à toi</small></span></button>
        <button class="linkish" id="fNoZHelp" type="button">Quand cocher cette case ?</button>
        <div class="row"><button class="btn primary" id="fSave">Enregistrer</button></div>
        ${isNew ? "" : `<div class="row"><button class="btn danger" id="fDel">Supprimer ce compte</button></div>`}`, isNew ? null : "fOp");
      const sh = $("sheet");
      const isMetal = () => d.type === "gold" || d.type === "silver";
      const keepOp = () => { d.name = $("fName").value; if ($("fOp")) opTyped = $("fOp").value; if ($("fAmt")) d.cents = toCents($("fAmt").value) || 0; if ($("fGrams")) d.grams = parse($("fGrams").value) || 0; };
      const keep = () => { d.name = $("fName").value; if ($("fAmt")) d.cents = toCents($("fAmt").value) || 0; if ($("fGrams")) d.grams = parse($("fGrams").value) || 0; };
      bindChips(sh, "data-type", t => { keep(); d.type = t; if (t === "crypto") d.currency = S.settings.ref; draw(); });
      bindChips(sh, "data-usage", u => { d.usage = u; $("usageInfo").textContent = u === "worn" ? "Bijou porté habituellement : non soumis à la zakat selon l'école malikite." : "Compté dans la zakat, au poids d'or pur."; });
      if (isNew && d.type === "cash") $("fName").oninput = () => { const c = suggestCurrency($("fName").value.trim()); if (c && $("fCur")) $("fCur").value = c; };
      const opValue = () => {
        if (isNew || !$("fOp")) return null;
        const raw = $("fOp").value.trim().replace(/^−/, "-");
        if (!raw) return op === "set" ? NaN : null;
        const sign = op === "sub" ? -1 : 1;
        if (isMetal()) { const g = parse(raw); if (!isFinite(g)) return NaN; return op === "set" ? g : Math.round(((a.grams || 0) + sign * Math.abs(g)) * 1000) / 1000; }
        const c = toCents(raw); if (isNaN(c)) return NaN; return op === "set" ? c : (a.cents || 0) + sign * Math.abs(c);
      };
      const preview = () => {

      $("fNoZHelp").onclick = () => helpSheet("exclude");
      bindChips(sh, "data-op", v => { keepOp(); op = v; if (v === "set") opTyped = null; draw(); setTimeout(() => { const el = $("fOp"); if (el) el.focus(); }, 50); });

        if (d.type === "crypto") d.currency = $("fCur").value;

        else if (isNaN(d.cents)) return toast("Montant invalide", true);
        d.name = d.name.trim();
        if (!d.name) { if (d.type === "cash") return toast("Indique le nom de la banque ou du compte", true); d.name = TYPES[d.type]; }
        delete d.bank;
        const before = isNew ? 0 : valueRef(a);
        await put("accounts", d);
        await recordMove(todayIso(), valueRef(d) - before, isNew ? "Nouveau compte : " + d.name : "Solde de " + d.name); await loadAll(); closeSheet(); renderAll(); toast(isNew ? "Compte ajouté" : "Compte mis à jour");

    };
    draw();
  }

  // ================= COMPTE ET SYNCHRO EN LIGNE (Supabase) =================
  // Les données restent dans l'appareil (l'appli marche hors ligne) et sont copiées sur le serveur.
  // Chaque modification passe par une file d'envoi (outbox) ; les modifications faites sur un autre
  // appareil sont récupérées à l'ouverture, au retour du réseau et toutes les 30 s.
  const SB_URL = CFG.supabaseUrl, SB_KEY = CFG.supabaseKey, TABLE = "zakat_entries";
  const SITE = location.origin + location.pathname.replace(/[^/]*$/, "");
  const LS_KEY = "zakat.session";
  const ls = {
    get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } },
    set: (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
  };
  class AuthError extends Error {}
  const jwtPayload = t => { try { return JSON.parse(decodeURIComponent(escape(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))))); } catch (_) { return {}; } };
  const ERR_FR = [
    [/invalid login credentials/i, "Email ou mot de passe incorrect."],
    [/email not confirmed/i, "Ton email n'est pas encore confirmé : clique sur le lien reçu par email, puis reconnecte-toi."],
    [/already registered|already exists/i, "Un compte existe déjà avec cet email : connecte-toi."],
    [/password should be at least|weak password/i, "Mot de passe trop court : 8 caractères minimum."],
    [/rate limit|too many/i, "Trop de tentatives : réessaie dans quelques minutes."],
    [/unable to validate email|invalid email/i, "Adresse email invalide."],
    [/failed to fetch|network|load failed/i, "Pas de connexion internet."]
  ];
  const frErr = m => { for (const [re, fr] of ERR_FR) if (re.test(m || "")) return fr; return m || "Erreur inconnue"; };
  const hhmm = t => new Date(t).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

  // ---------- Connexion Face ID / Touch ID (passkeys Supabase) ----------
  const b64uToBuf = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; };
  const bufToB64u = buf => { const u = new Uint8Array(buf); let b = ""; for (let i = 0; i < u.length; i++) b += String.fromCharCode(u[i]); return btoa(b).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  const passkey = {
    supported: () => !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext),
    known() { try { return localStorage.getItem("zakat.passkey") === "1"; } catch (_) { return false; } },
    remember() { try { localStorage.setItem("zakat.passkey", "1"); } catch (_) {} },
    creationOpts(o) {
      if (PublicKeyCredential.parseCreationOptionsFromJSON) return PublicKeyCredential.parseCreationOptionsFromJSON(o);
      return Object.assign({}, o, { challenge: b64uToBuf(o.challenge), user: Object.assign({}, o.user, { id: b64uToBuf(o.user.id) }),
        excludeCredentials: (o.excludeCredentials || []).map(c => Object.assign({}, c, { id: b64uToBuf(c.id) })) });
    },
    requestOpts(o) {
      if (PublicKeyCredential.parseRequestOptionsFromJSON) return PublicKeyCredential.parseRequestOptionsFromJSON(o);
      const r = Object.assign({}, o, { challenge: b64uToBuf(o.challenge) });
      if (o.allowCredentials && o.allowCredentials.length) r.allowCredentials = o.allowCredentials.map(c => Object.assign({}, c, { id: b64uToBuf(c.id) }));
      else delete r.allowCredentials;
      return r;
    },
    toJSON(c) {
      if (typeof c.toJSON === "function") return c.toJSON();
      const r = c.response, out = { id: c.id, rawId: c.id, type: "public-key", clientExtensionResults: c.getClientExtensionResults(),
        authenticatorAttachment: c.authenticatorAttachment || undefined, response: { clientDataJSON: bufToB64u(r.clientDataJSON) } };
      if (r.attestationObject) out.response.attestationObject = bufToB64u(r.attestationObject);
      if (r.authenticatorData) { out.response.authenticatorData = bufToB64u(r.authenticatorData); out.response.signature = bufToB64u(r.signature); if (r.userHandle) out.response.userHandle = bufToB64u(r.userHandle); }
      return out;
    },
    err(e) {
      const n = e && e.name;
      if (n === "NotAllowedError" || n === "AbortError") return "Face ID annulé.";
      if (n === "InvalidStateError") return "Face ID est déjà activé sur cet appareil.";
      const m = (e && e.message) || "";
      if (/passkey.*(disabled|not enabled)|not.*enabled/i.test(m)) return "La connexion Face ID n'est pas encore activée sur le serveur.";
      return frErr(m);
    },
    async register() {
      if (!navigator.onLine) { toast("Connecte-toi à internet pour activer Face ID", true); return; }
      try {
        const o = await cloud.api("/auth/v1/passkeys/registration/options", { method: "POST", body: "{}" });
        const cred = await navigator.credentials.create({ publicKey: passkey.creationOpts(o.options) });
        await cloud.api("/auth/v1/passkeys/registration/verify", { method: "POST", body: JSON.stringify({ challenge_id: o.challenge_id, credential: passkey.toJSON(cred) }) });
        passkey.remember(); closeSheet(); toast("Face ID activé");
        return true;
      } catch (e) { toast(passkey.err(e), true); return false; }
    },
    async login() {
      const b = $("aPasskey"); b.disabled = true;
      try {
        const o = await cloud.api("/auth/v1/passkeys/authentication/options", { method: "POST", body: "{}" }, false);
        const cred = await navigator.credentials.get({ publicKey: passkey.requestOpts(o.options) });
        const j = await cloud.api("/auth/v1/passkeys/authentication/verify", { method: "POST", body: JSON.stringify({ challenge_id: o.challenge_id, credential: passkey.toJSON(cred) }) }, false);
        const sess = j && j.access_token ? j : j && j.session;
        if (!sess || !sess.access_token) throw new Error("Réponse inattendue du serveur");
        cloud.saveSession(sess); passkey.remember();
        await cloud.enter(); renderAll(); toast("Connecté avec Face ID");
      } catch (e) { cloud.showAuth("login", passkey.err(e), true); }
      finally { b.disabled = false; }
    }
  };

  const cloud = {
    session: null, busy: false, again: false, err: null, last: null, timer: null, poll: null, pending: 0, mode: "login", recovery: false,
    async api(path, opts = {}, auth = true) {
      const headers = Object.assign({ apikey: SB_KEY, "Content-Type": "application/json" }, opts.headers || {});
      if (auth) headers.Authorization = "Bearer " + await cloud.token();
      const r = await fetch(SB_URL + path, Object.assign({}, opts, { headers, cache: "no-store" }));
      const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (_) {}
      if (!r.ok) {

    },
    storedSession() {

      if (ok(a) && ok(b)) return (b.expires_at || 0) > (a.expires_at || 0) ? b : a;

    schedule(ms) { if (!cloud.session) return; clearTimeout(cloud.timer); cloud.timer = setTimeout(() => cloud.syncNow(true), ms); cloud.refreshCount(); },
    rows: items => items.map(o => ({ user_id: cloud.session.user.id, store: o.store, id: o.id, data: o.data, deleted: o.deleted })),
    async push() {

          headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(cloud.rows(part)) });
        const cur = new Map((await getAll("outbox")).map(o => [o.key, JSON.stringify(o)]));

    async pull() {

        if (!rows || !rows.length) break;

      try {

          headers: { apikey: SB_KEY, Authorization: "Bearer " + s.access_token, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" } }).catch(() => {});

      if (cloud.busy) return "Synchronisation…";
      if (cloud.err) return "Synchro en échec · nouvel essai automatique";
      if (cloud.pending) return `${cloud.pending} modif. à envoyer…`;

    async start() {

    readLink() {

      }
      if (!h.get("access_token")) return false;
      cloud.saveSession({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_at: h.get("expires_at"), expires_in: h.get("expires_in") });
      cloud.recovery = h.get("type") === "recovery";
      if (h.get("type") === "signup") cloud.linkMsg = "Email confirmé, bienvenue !";
      history.replaceState(null, "", location.pathname + location.search);
      return true;
    },
    async enter() {
      const u = cloud.session.user;
      if (S.meta.userId && S.meta.userId !== u.id) await cloud.wipeLocal(); // un autre compte utilisait cet appareil
      if (S.meta.userId !== u.id) { await setMeta("userId", u.id); await setMeta("lastPull", undefined); }
      const wasShown = !$("auth").hidden;
      $("auth").hidden = true;
      if (wasShown && typeof appLock !== "undefined") appLock.afterLogin();
      if (cloud.linkMsg) { toast(cloud.linkMsg); cloud.linkMsg = null; }
      clearInterval(cloud.poll);
      cloud.poll = setInterval(() => { if (document.visibilityState === "visible") cloud.syncNow(true); }, 30000);

      cloud.syncNow(true);
    },
    async wipeLocal() {
      await new Promise((res, rej) => {
        const t = idb.transaction([...DATA_STORES, "outbox"], "readwrite");
        [...DATA_STORES, "outbox"].forEach(n => t.objectStore(n).clear());

    expired() {

      if (cloud.linkMsg && !msg) { m.hidden = false; m.textContent = cloud.linkMsg; m.className = "msg err"; cloud.linkMsg = null; }
