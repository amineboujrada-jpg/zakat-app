  // ================= VERROUILLAGE (COMME UNE APPLI BANCAIRE) =================
  // Code à 6 chiffres obligatoire, Face ID en option. L'appli se verrouille à chaque lancement et quand
  // on revient après le délai choisi (immédiatement, 1 min ou 5 min). Réglage propre à chaque appareil.
  // Face ID réutilise la clé d'accès (passkey) de la connexion : vérification sur l'iPhone, sans internet.
  const LOCK_KEY = "zakat.lock2", MAX_TRIES = 5;
  const DELAYS = [[0, "Immédiatement"], [60000, "Après 1 minute"], [300000, "Après 5 minutes"]];
  const sha = async t => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))].map(b => b.toString(16).padStart(2, "0")).join("");
  const appLock = {
    cfg() { try { return JSON.parse(localStorage.getItem(LOCK_KEY)) || null; } catch (_) { return null; } },
    save(c) { try { if (c) localStorage.setItem(LOCK_KEY, JSON.stringify(c)); else localStorage.removeItem(LOCK_KEY); } catch (_) {} },
    patch(p) { appLock.save(Object.assign({}, appLock.cfg() || {}, p)); },
    hasCode() { const c = appLock.cfg(); return !!(c && c.hash); },
    delay() { const c = appLock.cfg(); return c && typeof c.delay === "number" ? c.delay : 300000; },
    faceOn() { const c = appLock.cfg(); return passkey.supported() && passkey.known() && !(c && c.face === false); },
    // Longueur du code : 4 ou 6 chiffres (les anciens codes sans réglage font 6 chiffres)
    len() { if (appLock.mode === "unlock") { const c = appLock.cfg(); return (c && c.len) || 6; } return appLock.setupLen; },
    setupLen: 4,
    mode: null, entry: "", first: "", tries: 0, hiddenAt: 0, busy: false, resetPending: false,
    // Afficher l'écran : "unlock" (déverrouiller), "setup" (créer le code), "confirm"
    open(mode, msg, err) {
      appLock.mode = mode; appLock.entry = ""; closeSheet();
      $("lock").hidden = false;
      $("lkTitle").textContent = mode === "unlock" ? "Zakat est verrouillée" : mode === "setup" ? "Crée ton code" : "Confirme ton code";
      const m = $("lkMsg");
      const n = appLock.len();
      m.textContent = msg || (mode === "unlock" ? (appLock.faceOn() ? "Entre ton code ou utilise Face ID." : `Entre ton code à ${n} chiffres.`)
        : mode === "setup" ? `Comme pour une appli bancaire : ce code à ${n} chiffres protège tes comptes.` : "Tape le même code une seconde fois.");
      $("lkDots").innerHTML = "<i></i>".repeat(n);
      $("lkLen").hidden = mode !== "setup";
      $("lkLen").textContent = `Utiliser plutôt un code à ${n === 4 ? 6 : 4} chiffres`;
      m.className = err ? "err" : "";
      $("lkFace").style.visibility = mode === "unlock" && appLock.faceOn() ? "visible" : "hidden";
      $("lkForgot").hidden = mode !== "unlock";
      appLock.dots();
    },
    dots() { [...$("lkDots").children].forEach((d, i) => d.classList.toggle("on", i < appLock.entry.length)); },
    shake() { const d = $("lkDots"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake"); if (navigator.vibrate) navigator.vibrate(120); },
    close() { $("lock").hidden = true; appLock.mode = null; appLock.entry = ""; renderAll(); },
    async key(k) {
      if (!appLock.mode || appLock.busy) return;
      if (k === "del") { appLock.entry = appLock.entry.slice(0, -1); appLock.dots(); return; }
      const n = appLock.len();
      if (appLock.entry.length >= n) return;
      appLock.entry += k; appLock.dots();
      if (appLock.entry.length < n) return;
      appLock.busy = true;
      try {
        const pin = appLock.entry;
        if (appLock.mode === "setup") { appLock.first = pin; setTimeout(() => appLock.open("confirm"), 150); return; }
        if (appLock.mode === "confirm") {
          if (pin !== appLock.first) { appLock.shake(); setTimeout(() => appLock.open("setup", "Les deux codes ne correspondent pas. Recommence.", true), 300); return; }
          const salt = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join("");
          appLock.patch({ hash: await sha(salt + pin), salt, len: appLock.setupLen, delay: appLock.delay() });
          appLock.tries = 0; appLock.close(); toast("Code enregistré : l'appli est protégée");
          setTimeout(() => appLock.offerFace(true), 700);
          return;
        }
        const c = appLock.cfg();
        if (c && (await sha(c.salt + pin)) === c.hash) { appLock.tries = 0; appLock.close(); setTimeout(() => appLock.offerFace(false), 500); return; }
        appLock.tries++; appLock.shake();
        if (appLock.tries >= MAX_TRIES) { setTimeout(() => appLock.forgot("Trop d'essais. Reconnecte-toi avec ton mot de passe, puis choisis un nouveau code."), 400); return; }
        setTimeout(() => appLock.open("unlock", `Code incorrect. Encore ${MAX_TRIES - appLock.tries} essai${MAX_TRIES - appLock.tries > 1 ? "s" : ""}.`, true), 300);
      } finally { appLock.busy = false; }
    },
    async face(auto) {

      try {
        const challenge = crypto.getRandomValues(new Uint8Array(32));
        const cred = await navigator.credentials.get({ publicKey: { challenge, rpId: location.hostname, userVerification: "required", timeout: 60000 } });
        const ad = new Uint8Array(cred.response.authenticatorData);
        if (ad.length > 32 && (ad[32] & 0x04)) { appLock.tries = 0; appLock.close(); } // l'utilisateur a bien été vérifié
      } catch (e) { if (!auto) appLock.open("unlock", passkey.err(e), true); }
    },
    // Proposer Face ID quand l'iPhone le permet et qu'il n'est pas encore activé sur cet appareil
    offerFace(force) {
      const c = appLock.cfg() || {};
      if (!CLOUD || !cloud.session || !passkey.supported() || passkey.known()) return;
      if (!force && c.faceAsked && Date.now() - c.faceAsked < 7 * 864e5) return; // au plus une fois par semaine
      appLock.patch({ faceAsked: Date.now() });
      openSheet(`<h2>Déverrouiller avec Face ID ?</h2>
        <p class="note" style="margin:6px 0 18px">Tu n'auras plus besoin de taper ton code : un regard suffit. Le code reste là en secours.</p>
        <div class="stack"><button class="btn" id="ofYes">Activer Face ID</button><button class="btn ghost" id="ofNo">Plus tard</button></div>`);
      $("ofYes").onclick = async () => { if (await passkey.register()) { appLock.patch({ face: true }); } };
      $("ofNo").onclick = closeSheet;
    },
    forgot(msg) {
      if (!CLOUD) { appLock.open("unlock", "Sans compte en ligne, le code ne peut pas être réinitialisé. Réessaie dans un moment.", true); appLock.tries = MAX_TRIES - 1; return; }
      appLock.resetPending = true; $("lock").hidden = true; appLock.mode = null;
      cloud.showAuth("login", msg || "Entre ton mot de passe : tu pourras ensuite choisir un nouveau code.");
      if (cloud.session) $("aEmail").value = cloud.session.user.email || "";
    },
    // À l'ouverture : créer le code s'il n'existe pas, sinon demander le code
    guard() {
      if (CLOUD && !cloud.session) return; // l'écran de connexion passe d'abord
      if (!appLock.hasCode()) appLock.open("setup");
      else { appLock.open("unlock"); setTimeout(() => appLock.face(true), 400); }
    },
    afterLogin() {
      if (appLock.resetPending) { appLock.resetPending = false; appLock.patch({ hash: null, salt: null }); appLock.tries = 0; }
      if (!appLock.hasCode()) appLock.open("setup");
    }
  };
  $("lkPad").querySelectorAll("[data-k]").forEach(b => (b.onclick = () => appLock.key(b.dataset.k)));
  $("lkFace").onclick = () => appLock.face(false);
  $("lkForgot").onclick = () => appLock.forgot();
  $("lkLen").onclick = () => { appLock.setupLen = appLock.setupLen === 4 ? 6 : 4; appLock.open("setup"); };
  document.addEventListener("keydown", e => { if (!$("lock").hidden && /^[0-9]$/.test(e.key)) appLock.key(e.key); else if (!$("lock").hidden && e.key === "Backspace") appLock.key("del"); });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") { if ($("lock").hidden) appLock.hiddenAt = Date.now(); }
    else if (appLock.hiddenAt && $("lock").hidden && appLock.hasCode() && Date.now() - appLock.hiddenAt >= appLock.delay()) { appLock.hiddenAt = 0; appLock.guard(); }
  });

  function updateStatus() {
    $("status").textContent = CLOUD ? (cloud.session ? cloud.statusText() : "Non connecté") : "Mode local · données sur cet appareil";
  }

  // ================= DÉMARRAGE =================
  (async () => {
    // Adresse en http:// (certificat HTTPS pas encore prêt) : la sécurité du navigateur bloque le code et Face ID
    if (!window.isSecureContext && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
      document.body.innerHTML = `<div style="max-width:420px;margin:0 auto;padding:60px 24px;text-align:center;font-family:-apple-system,system-ui,sans-serif;color:#1b2a24">
        <img src="icon-192.png" alt="" style="width:64px;height:64px;border-radius:16px"><h2>Connexion pas encore sécurisée</h2>
        <p style="color:#5b6b64;line-height:1.5">Le certificat HTTPS de ${location.hostname} est en cours d'activation. Pour protéger tes données, l'appli ne s'ouvre qu'en connexion sécurisée.</p>
        <p><a href="https://${location.host}${location.pathname}" style="display:inline-block;background:#1f6b52;color:#fff;padding:14px 22px;border-radius:12px;text-decoration:none;font-weight:700">Réessayer en HTTPS</a></p></div>`;
      return;
    }
    try { idb = await openDb(); await loadAll(); }
    catch (e) { document.body.innerHTML = `<p style="padding:24px">Impossible d'ouvrir la base de l'appareil (mode navigation privée ?).</p>`; return; }
    try { const t = localStorage.getItem("zakat.tab"); if (t && FAB[t]) setTab(t); } catch (_) {}
    market = S.meta["market_" + S.settings.ref] || null;
    renderAll();
    if (CLOUD) await cloud.start();
    if ($("auth").hidden) appLock.guard();
    loadMarket();
    window.addEventListener("online", () => { updateStatus(); loadMarket(); if (CLOUD) cloud.syncNow(true); });
    window.addEventListener("offline", updateStatus);
    document.addEventListener("visibilitychange", () => { if (CLOUD && document.visibilityState === "hidden") cloud.flush(); else if (document.visibilityState === "visible") { if (CLOUD) cloud.syncNow(true); loadMarket(); } });
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  })();
})();
</script>
